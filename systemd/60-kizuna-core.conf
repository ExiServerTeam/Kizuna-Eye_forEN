# ============================================================
# Kizuna-Eye コアダンプ設定 (sysctl)
#
# Ubuntu の既定 core_pattern は apport へのパイプ:
#   |/usr/share/apport/apport -p%p -s%s -c%c -d%d -P%P -u%u -g%g -F%F -- %E
# これは「クラッシュレポート」を /var/crash に作るが、Go ランタイムの
# SIGSEGV では apport が処理しきれずコア本体が残らないことがある。
# ここではコアを確実に 1 ファイルとして残す（gdb でスタックを解析できる）。
#
# インストール:
#   sudo systemd/setup-coredump.sh
# ============================================================

# %e=実行ファイル名 %p=PID %t=クラッシュ時刻(Unix epoch)
kernel.core_pattern=/var/lib/kizuna-eye/coredump/core.%e.%p.%t

# コアのファイル名に PID を含める（core_pattern で %p を使っている場合は不要だが、
# 別の設定に戻したときの取りこぼし防止）。
kernel.core_uses_pid=1

# 非 setuid の通常プロセスでもダンプを許可（agent は非 root・非 setuid）。
fs.suid_dumpable=1
