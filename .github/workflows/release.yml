name: Release

# v* タグの push で動く。やること:
#   1. 署名鍵（GitHub Secret）を復元
#   2. ubuntu:20.04 コンテナ内でビルド → .deb 生成 → apt-repo 構築 → 20.04 で実検証
#   3. GitHub Release を作成し、.deb / tarball / 公開鍵を添付
#   4. apt-repo を gh-pages へ公開（= apt install kizuna-eye の配布元）
#
# 必要な設定（リポジトリの Settings）:
#   - Secret: KIZUNA_APT_SIGNING_KEY
#       署名鍵の base64。作成方法:
#         gpg --homedir .gnupg-apt --export-secret-keys | base64 -w0
#   - Settings > Actions > General > Workflow permissions:
#       "Read and write permissions" を有効化（Release 作成と gh-pages push に必要）
#
# ユーザー側の登録（初回のみ）:
#   curl -fsSL https://<owner>.github.io/<repo>/kizuna.gpg \
#     | sudo gpg --dearmor -o /usr/share/keyrings/kizuna.gpg
#   echo "deb [signed-by=/usr/share/keyrings/kizuna.gpg] https://<owner>.github.io/<repo> stable main" \
#     | sudo tee /etc/apt/sources.list.d/kizuna.list
#   sudo apt update && sudo apt install kizuna-eye

on:
  push:
    tags:
      - 'v*'
  # 手動実行も可能にする（再公開・検証用）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg rsync

      - name: Restore apt signing key
        env:
          KIZUNA_APT_SIGNING_KEY: ${{ secrets.KIZUNA_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KIZUNA_APT_SIGNING_KEY:-}" ]; then
            echo "::error::Secret KIZUNA_APT_SIGNING_KEY is not set. See the header of release.yml."
            exit 1
          fi
          mkdir -p .gnupg-apt
          chmod 700 .gnupg-apt
          echo "$KIZUNA_APT_SIGNING_KEY" | base64 -d \
            | gpg --homedir .gnupg-apt --batch --import
          gpg --homedir .gnupg-apt --list-secret-keys

      - name: Build .deb + apt repo (ubuntu:20.04)
        # release.sh: 署名鍵 → 20.04 でビルド → apt-repo 構築 → 20.04 で apt install 実検証
        run: |
          sudo ./packaging/release.sh
          # release.sh は root で走るため、生成物をランナーユーザーへ戻す
          # （gh-pages への公開と Release 添付に必要）。
          sudo chown -R "$(id -u):$(id -g)" dist apt-repo

      - name: Build tarball for auto-update
        # agent_config.example.json の auto_update.archive_name と名前を合わせる。
        # safe_update.sh 自体は git pull + 再ビルドで更新するが、go-rocket-update の
        # バージョン検出がリリースを正しく解決できるよう、同名アセットを添付しておく。
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          ( cd "$WORK" && ar x "$GITHUB_WORKSPACE"/dist/kizuna-eye_*_amd64.deb && tar -xJf data.tar.xz )
          tar -czf dist/kizuna-eye-linux-amd64.tar.gz -C "$WORK" opt/kizuna-eye/bin usr/share/kizuna-eye
          rm -rf "$WORK"
          ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/kizuna-eye-linux-amd64.tar.gz
            apt-repo/kizuna.gpg
            apt-repo/kizuna-keyring.gpg
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish apt repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
