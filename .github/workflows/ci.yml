name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync

      - name: Build agent
        run: CGO_ENABLED=1 go build -o /tmp/agent_linux ./cmd/agent

      - name: Build dashboard
        run: CGO_ENABLED=1 go build -o /tmp/dashboard_linux ./cmd/dashboard

      - name: Build plugin-inspect
        run: CGO_ENABLED=1 go build -o /tmp/plugin-inspect ./cmd/plugin-inspect

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./... -v
