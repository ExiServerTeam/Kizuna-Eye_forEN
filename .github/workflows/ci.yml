name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync

      - name: Build agent
        run: CGO_ENABLED=1 go build -o /tmp/agent_linux ./cmd/agent

      - name: Build dashboard
        run: CGO_ENABLED=1 go build -o /tmp/dashboard_linux ./cmd/dashboard

      - name: Build plugin-inspect
        run: CGO_ENABLED=1 go build -o /tmp/plugin-inspect ./cmd/plugin-inspect

      - name: Build plugin-sign
        run: CGO_ENABLED=0 go build -o /tmp/plugin-sign ./cmd/plugin-sign

      - name: Run go vet
        run: go vet ./...

      - name: Run go test (with race detector)
        run: go test -race ./... -v

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      # Scan dependencies and the module for known vulnerabilities. This is
      # a non-blocking report by default (the tool exits non-zero only when a
      # reachable vulnerability is found). It runs on every push/PR so a
      # vulnerable dependency is visible before release.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build-essential for CGO/race and building the plugin binaries; curl
      # is used by the smoke checks.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

      # verify.sh --smoke builds the binaries, starts dashboard+agent and
      # exercises the HTTP API. It needs a config set; generate one from the
      # shipped examples (matched agent token, no signature requirement, no
      # notifications).
      - name: Generate smoke config
        run: ./scripts/smoke-config.sh "$PWD/smoke-data"

      - name: Run E2E smoke
        env:
          KIZUNA_DATA_DIR: ${{ github.workspace }}/smoke-data
          BIN_DIR: ${{ github.workspace }}/out
        run: ./scripts/verify.sh --smoke

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so scripts/check_secrets.sh can walk the full published
      # history (remote branches + tags) instead of only the checkout commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      # gofmt is otherwise only checked by scripts/verify.sh (E2E). Fail fast
      # here so a formatting regression is obvious without waiting for E2E.
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "gofmt violations:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck (warnings are fatal)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend static checks (XSS guard / i18n consistency)
        run: |
          node scripts/check_xss.js
          node scripts/check_i18n.js

      - name: Check bilingual comments (JA + EN)
        run: |
          node scripts/check_comments.cjs --strict --no-tests cmd internal pkg
          node scripts/check_comments.cjs --strict --lang js web/static
          node scripts/check_comments.cjs --strict --lang sh .
          node scripts/check_comments.cjs --strict --lang systemd systemd

      - name: Check that no secrets are committed
        run: bash scripts/check_secrets.sh
