<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-i18n-doc-title="setup.page_title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kizuna-Eye - 初期セットアップ</title>
    <link rel="stylesheet" href="/style.css?v=0.7.1">
    <link rel="stylesheet" href="/auth.css?v=0.7.1">
    <script src="/auth-theme.js?v=0.7.1"></script>
</head>
<body class="auth-body">
    <button type="button" class="auth-theme-toggle" id="authThemeToggle" aria-label="テーマ切り替え" data-i18n-aria-label="theme.toggle">
        <span class="auth-theme-icon" id="authThemeIcon">🌙</span>
    </button>
    <div class="auth-card">
        <h1 class="auth-logo">Kizuna-Eye</h1>
        <p class="auth-subtitle" data-i18n="setup.subtitle">管理者アカウントの作成</p>
        <p class="auth-note" data-i18n="setup.note">最初に作成されたユーザーが管理者になります。</p>
        <form id="setupForm" class="auth-form">
            <label class="auth-label" for="username" data-i18n="setup.username">ユーザー名</label>
            <input class="auth-input" type="text" id="username" name="username" autocomplete="username" required autofocus>
            <span class="auth-hint" data-i18n="setup.username_hint">英数字・_ . - の3〜32文字</span>

            <label class="auth-label" for="password" data-i18n="setup.password">パスワード</label>
            <input class="auth-input" type="password" id="password" name="password" autocomplete="new-password" required>
            <span class="auth-hint" data-i18n="setup.password_hint">8文字以上</span>

            <label class="auth-label" for="password2" data-i18n="setup.password2">パスワード（確認）</label>
            <input class="auth-input" type="password" id="password2" name="password2" autocomplete="new-password" required>

            <button type="submit" class="auth-btn" id="setupBtn" data-i18n="setup.button">管理者を作成して開始</button>
            <p class="auth-error" id="authError" hidden></p>
        </form>
    </div>
    <script src="/i18n.js?v=0.7.1"></script>
    <script src="/setup.js?v=0.7.1"></script>
</body>
</html>
