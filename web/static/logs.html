<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-i18n-doc-title="logs.page_title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kizuna-Eye - ログ</title>
    <link rel="stylesheet" href="/style.css?v=0.7.1">
    <link rel="stylesheet" href="/logs.css?v=0.7.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body data-role-min="operator">
    <div class="app">
        <header class="header">
            <div class="header-main">
                <h1 class="logo">Kizuna-Eye</h1>
                <span class="status-badge" id="connectionStatus">接続中</span>
                <nav class="nav-tabs">
                    <a href="/" class="nav-tab" data-i18n="nav.dashboard">ダッシュボード</a>
                    <a href="/modules.html" class="nav-tab" data-role-min="operator" data-i18n="nav.modules">モジュール管理</a>
                    <a href="/config-editor.html" class="nav-tab" data-role-min="admin" data-i18n="nav.config">設定エディタ</a>
                    <a href="/logs.html" class="nav-tab active" data-role-min="operator" data-i18n="nav.logs">ログ</a>
                </nav>
                <div class="header-controls">
                    <button id="langToggle" class="theme-toggle" aria-label="言語切り替え" data-i18n-aria-label="lang.toggle">
                        <span class="theme-icon" id="langIcon">🌐</span>
                        <span class="theme-label" id="langLabel" data-i18n="lang.label">JA</span>
                    </button>
                    <button id="themeToggle" class="theme-toggle" aria-label="テーマ切り替え" data-i18n-aria-label="theme.toggle">
                        <span class="theme-icon" id="themeIcon">🌙</span>
                        <span class="theme-track"><span class="theme-thumb"></span></span>
                        <span class="theme-label" id="themeLabel">ダーク</span>
                    </button>
                    <span class="version-badge">v0.7.1</span>
                </div>
            </div>
            <div class="header-user" id="headerUser"></div>
        </header>

        <main class="main">
            <div class="page-header">
                <div class="page-header-left">
                    <h2 data-i18n="logs.title">ログ</h2>
                    <p class="page-desc" data-i18n="logs.desc">Agent / Dashboard のログを表示します。</p>
                </div>
            </div>

            <!-- ツールバー: 左に「種類」のセグメント、右に操作を1行でまとめる。 -->
            <div class="log-toolbar">
                <span class="log-toolbar-label" data-i18n="logs.type_label">種類</span>
                <div class="log-type-buttons" id="logTypeButtons">
                    <button type="button" class="btn-secondary active" id="logTypeAgent" data-type="agent">Agent</button>
                    <button type="button" class="btn-secondary" id="logTypeDashboard" data-type="dashboard">Dashboard</button>
                    <!-- プラグイン等の別ログファイルは /api/logs/types からこの中へ動的に追加 -->
                </div>
                <div class="log-toolbar-ops">
                    <label class="log-lines-label"><span data-i18n="logs.lines">行数</span>
                        <select id="logLines" class="log-lines-select">
                            <option value="50">50</option>
                            <option value="100" selected>100</option>
                            <option value="200">200</option>
                            <option value="500">500</option>
                        </select>
                    </label>
                    <!-- テキストは logs.js が言語と状態に応じて設定するため、
                         data-i18n を付けない（付けると i18n が状態を無視して
                         上書きしてしまう）。 -->
                    <button type="button" class="btn-secondary" id="logFormatBtn">表示: JSON</button>
                    <button type="button" class="btn-secondary" id="logFollowBtn">自動更新: ON</button>
                    <button type="button" class="btn-primary" id="logReloadBtn" data-i18n="logs.reload">再読み込み</button>
                </div>
            </div>

            <!-- 検索 / フィルタ行 -->
            <div class="log-filterbar">
                <input type="text" id="logSearch" class="log-search"
                       placeholder="検索 (grep / 正規表現)" data-i18n-placeholder="logs.search_ph">
                <label class="log-filter-label">
                    <input type="checkbox" id="logSearchRegex">
                    <span data-i18n="logs.regex">正規表現</span>
                </label>
                <label class="log-filter-label"><span data-i18n="logs.level">レベル</span>
                    <select id="logLevelFilter" class="log-lines-select">
                        <option value="" data-i18n="logs.level_all">すべて</option>
                        <option value="critical">CRITICAL</option>
                        <option value="warning">WARNING</option>
                        <option value="info">INFO</option>
                    </select>
                </label>
                <label class="log-filter-label"><span data-i18n="logs.event">イベント</span>
                    <select id="logEventFilter" class="log-lines-select">
                        <option value="" data-i18n="logs.event_all">すべて</option>
                    </select>
                </label>
                <span class="log-match-count" id="logMatchCount"></span>
            </div>

            <div class="log-viewer-container">
                <pre class="log-viewer" id="logViewer" data-i18n="logs.loading">読み込み中...</pre>
                <div class="log-status" id="logStatus"></div>
            </div>
        </main>

        <footer class="footer">
            <p>Kizuna-Eye v0.7.1 &middot; <span data-i18n="footer.tagline">リアルタイムシステムモニタリング</span></p>
        </footer>
    </div>

    <div id="toastContainer"></div>

    <script src="/lang.js"></script>
    <script src="/i18n.js?v=0.7.1"></script>
    <script src="/auth-guard.js?v=0.7.1"></script>
    <script src="/connection.js?v=0.7.1"></script>
    <script src="/escape.js?v=0.7.1"></script>
    <script src="/logs.js?v=0.7.1"></script>
</body>
</html>
