<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kizuna-Eye - ログ</title>
    <link rel="stylesheet" href="/style.css?v=0.7.2">
    <link rel="stylesheet" href="/logs.css?v=0.7.2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1 class="logo">Kizuna-Eye</h1>
                <nav class="nav-tabs">
                    <a href="/" class="nav-tab" data-i18n="nav.dashboard">ダッシュボード</a>
                    <a href="/modules.html" class="nav-tab" data-role-min="operator" data-i18n="nav.modules">モジュール管理</a>
                    <a href="/config-editor.html" class="nav-tab" data-role-min="admin" data-i18n="nav.config">設定エディタ</a>
                    <a href="/logs.html" class="nav-tab active" data-i18n="nav.logs">ログ</a>
                </nav>
                <span class="status-badge" id="connectionStatus">接続中</span>
            </div>
            <div class="header-right">
                <span class="version-badge">v0.6.1</span>
                <button id="langToggle" class="theme-toggle" aria-label="言語切り替え" data-i18n-aria-label="lang.toggle">
                    <span class="theme-icon" id="langIcon">🌐</span>
                    <span class="theme-label" id="langLabel" data-i18n="lang.label">JA</span>
                </button>
                <button id="themeToggle" class="theme-toggle" aria-label="テーマ切り替え">
                    <span class="theme-icon" id="themeIcon">🌙</span>
                    <span class="theme-track"><span class="theme-thumb"></span></span>
                    <span class="theme-label" id="themeLabel">ダーク</span>
                </button>
            </div>
        </header>

        <main class="main">
            <div class="page-header">
                <div class="page-header-left">
                    <h2 data-i18n="logs.title">ログ</h2>
                    <p class="page-desc" data-i18n="logs.desc">Agent / Dashboard のログを表示します。</p>
                </div>
                <div class="page-header-right">
                    <div class="file-actions">
                        <button type="button" class="btn-secondary active" id="logTypeAgent" data-type="agent">Agent</button>
                        <button type="button" class="btn-secondary" id="logTypeDashboard" data-type="dashboard">Dashboard</button>
                        <label class="log-lines-label"><span data-i18n="logs.lines">行数</span>
                            <select id="logLines" class="log-lines-select">
                                <option value="50">50</option>
                                <option value="100" selected>100</option>
                                <option value="200">200</option>
                                <option value="500">500</option>
                                <option value="1000">1000</option>
                            </select>
                        </label>
                        <button type="button" class="btn-secondary" id="logFollowBtn">自動更新: OFF</button>
                        <button type="button" class="btn-primary" id="logReloadBtn" data-i18n="logs.reload">再読み込み</button>
                    </div>
                </div>
            </div>

            <div class="log-viewer-container">
                <pre class="log-viewer" id="logViewer">読み込み中...</pre>
                <div class="log-status" id="logStatus"></div>
            </div>
        </main>

        <footer class="footer">
            <p>Kizuna-Eye v0.6.1 &middot; リアルタイムシステムモニタリング</p>
        </footer>
    </div>

    <div id="toastContainer"></div>

    <script src="/i18n.js?v=0.7.2"></script>
    <script src="/auth-guard.js?v=0.7.2"></script>
    <script src="/connection.js?v=0.7.2"></script>
    <script src="/logs.js?v=0.7.2"></script>
</body>
</html>
