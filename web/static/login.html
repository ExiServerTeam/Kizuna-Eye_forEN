<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-i18n-doc-title="login.page_title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kizuna-Eye - ログイン</title>
    <link rel="stylesheet" href="/style.css?v=3f743833">
    <link rel="stylesheet" href="/auth.css?v=be88e0df">
    <link rel="stylesheet" href="/redesign.css?v=16830b49">
    <script src="/auth-theme.js?v=9daac8df"></script>
</head>
<body class="auth-body">
    <button type="button" class="auth-theme-toggle" id="authThemeToggle" aria-label="テーマ切り替え" data-i18n-aria-label="theme.toggle">
        <span class="auth-theme-icon" id="authThemeIcon"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
    </button>
    <button type="button" class="auth-lang-toggle" id="langToggle" aria-label="言語切り替え" data-i18n-aria-label="lang.toggle">
        <span id="langLabel">JA</span>
    </button>
    <div class="auth-card">
        <h1 class="auth-logo">Kizuna-Eye</h1>
        <p class="auth-subtitle" data-i18n="login.subtitle">ログイン</p>
        <form id="loginForm" class="auth-form">
            <label class="auth-label" for="username" data-i18n="login.username">ユーザー名</label>
            <input class="auth-input" type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label class="auth-label" for="password" data-i18n="login.password">パスワード</label>
            <input class="auth-input" type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="auth-btn" id="loginBtn" data-i18n="login.button">ログイン</button>
            <button type="button" class="auth-btn auth-btn-secondary" id="guestBtn" hidden data-i18n="login.guest_button">ゲストとしてログイン</button>
            <p class="auth-error" id="authError" hidden></p>
        </form>
    </div>
    <script src="/lang.js"></script>
    <script src="/i18n.js?v=c0dd270e"></script>
    <script src="/login.js?v=ba30bebb"></script>
</body>
</html>
