<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-i18n-doc-title="login.page_title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kizuna-Eye - ログイン</title>
    <link rel="stylesheet" href="/style.css?v=0.7.1">
    <link rel="stylesheet" href="/auth.css?v=0.7.1">
    <script src="/auth-theme.js?v=0.7.1"></script>
</head>
<body class="auth-body">
    <button type="button" class="auth-theme-toggle" id="authThemeToggle" aria-label="テーマ切り替え" data-i18n-aria-label="theme.toggle">
        <span class="auth-theme-icon" id="authThemeIcon">🌙</span>
    </button>
    <div class="auth-card">
        <h1 class="auth-logo">Kizuna-Eye</h1>
        <p class="auth-subtitle" data-i18n="login.subtitle">ログイン</p>
        <form id="loginForm" class="auth-form">
            <label class="auth-label" for="username" data-i18n="login.username">ユーザー名</label>
            <input class="auth-input" type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label class="auth-label" for="password" data-i18n="login.password">パスワード</label>
            <input class="auth-input" type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="auth-btn" id="loginBtn" data-i18n="login.button">ログイン</button>
            <button type="button" class="auth-btn auth-btn-secondary" id="guestBtn" hidden data-i18n="login.guest_button">ゲストとしてログイン</button>
            <p class="auth-error" id="authError" hidden></p>
        </form>
    </div>
    <script src="/i18n.js?v=0.7.1"></script>
    <script src="/login.js?v=0.7.1"></script>
</body>
</html>
