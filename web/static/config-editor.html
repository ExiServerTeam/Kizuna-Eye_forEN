<!DOCTYPE html>
<html lang="ja" data-i18n-doc-title="config.page_title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>設定エディタ - Kizuna-Eye</title>
    <link rel="stylesheet" href="/style.css?v=65b65169">
    <link rel="stylesheet" href="/config-editor.css?v=3f5b7690">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/redesign.css?v=16830b49">
    <!-- テーマは描画前に適用する（一瞬の色反転を防ぐ）。 -->
    <script src="auth-theme.js?v=bb16b2fb"></script>
</head>
<body class="config-editor-page" data-role-min="admin">
    <div class="app">
        <header class="header">
            <div class="header-main">
                <h1 class="logo">Kizuna-Eye</h1>
                <span class="status-badge" id="connectionStatus">接続中</span>
                <nav class="nav-tabs">
                    <a href="/" class="nav-tab" data-i18n="nav.dashboard">ダッシュボード</a>
                    <a href="/modules.html" class="nav-tab" data-role-min="operator" data-i18n="nav.modules">モジュール管理</a>
                    <a href="/config-editor.html" class="nav-tab active" data-role-min="admin" data-i18n="nav.config">設定エディタ</a>
                    <a href="/logs.html" class="nav-tab" data-role-min="operator" data-i18n="nav.logs">ログ</a>
                </nav>
                <div class="header-controls">
                    <button id="langToggle" class="theme-toggle" aria-label="言語切り替え" data-i18n-aria-label="lang.toggle">
                        <span class="theme-icon" id="langIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg></span>
                        <span class="theme-label" id="langLabel" data-i18n="lang.label">JA</span>
                    </button>
                    <button id="themeToggle" class="theme-toggle" aria-label="テーマ切り替え" data-i18n-aria-label="theme.toggle">
                        <span class="theme-icon" id="themeIcon"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
                        <span class="theme-track"><span class="theme-thumb"></span></span>
                        <span class="theme-label" id="themeLabel">ダーク</span>
                    </button>
                    <span class="version-badge">v0.7.1</span>
                </div>
            </div>
            <div class="header-user" id="headerUser"></div>
        </header>

        <main class="config-main">
            <div class="config-container">
                <div class="config-sidebar">
                    <h2 class="sidebar-title" data-i18n="config.sidebar_title">設定ファイル</h2>
                    <div class="config-file-list">
                        <button class="config-file-btn active" data-type="agent">
                            <span class="file-name" data-i18n="config.file_agent">エージェントの設定</span>
                        </button>
                        <button class="config-file-btn" data-type="dashboard">
                            <span class="file-name" data-i18n="config.file_dashboard">ダッシュボードの設定</span>
                        </button>
                        <button class="config-file-btn" data-type="alerts">
                            <span class="file-name" data-i18n="config.alerts_title">システム監視アラート</span>
                        </button>
                    </div>
                </div>

                <div class="config-editor-area">
                    <div class="editor-header">
                        <h2 class="editor-title" id="editorTitle" data-i18n="config.file_agent">エージェントの設定</h2>
                        <div class="editor-toolbar">
                            <div class="editor-mode" id="editorMode">
                                <button class="mode-btn active" id="modeGuiBtn" data-i18n="config.mode_gui">GUI</button>
                                <button class="mode-btn" id="modeJsonBtn" data-i18n="config.mode_json">JSON</button>
                            </div>
                            <div class="editor-actions" id="editorActions">
                                <button class="btn-secondary" id="historyBtn" data-i18n="config.history">履歴</button>
                                <button class="btn-secondary" id="templateBtn" data-i18n="config.insert_template">ひな形を挿入</button>
                                <button class="btn-secondary" id="formatBtn" data-i18n="config.format">フォーマット</button>
                                <button class="btn-secondary" id="validateBtn" data-i18n="config.validate">検証</button>
                                <button class="btn-primary" id="saveBtn" data-i18n="config.save">保存</button>
                            </div>
                        </div>
                    </div>

                    <div class="editor-body">
                        <textarea 
                            id="configEditor" 
                            class="config-textarea" 
                            spellcheck="false"
                            data-i18n-placeholder="config.placeholder"
                            placeholder="設定ファイルのJSONをここに編集..."
                        ></textarea>
                    </div>

                    <div class="editor-footer">
                        <div class="validation-status" id="validationStatus">
                            <span class="status-text" data-i18n="config.valid_json">有効なJSON</span>
                        </div>
                        <div class="editor-info">
                            <span id="charCount">0 文字</span>
                            <span id="lineCount">0 行</span>
                        </div>
                    </div>

                    <!-- GUI 設定フォーム -->
                    <div class="gui-panel" id="guiPanel" style="display:none;">
                        <!-- 保存ボタンはヘッダー上部の #saveBtn に一本化した（下部の
                             重複ボタンを削除）。#saveBtn は currentSaveFn() 経由で
                             GUI/JSON/アラートの各モードに応じた保存処理を呼ぶ。 -->
                        <div class="gui-body" id="guiBody"></div>
                    </div>

                    <!-- アラート閾値エディタ -->
                    <div class="alert-config-panel" id="alertConfigPanel" style="display:none;">
                        <p class="gui-help" data-i18n="config.alerts_help">CPU・メモリ・ディスク・温度の監視しきい値です（Kizuna-Eye 本体の機能。プラグインの有無に関係なく動作します）。セキュリティプラグインの通知設定は「モジュール管理」画面で行います。</p>
                        <div class="alert-config-body">
                            <div class="config-field">
                                <label for="acMemWarn" data-i18n="config.memory_warn">メモリ警告閾値 (%)</label>
                                <input type="number" id="acMemWarn" min="0" max="100" step="1">
                            </div>
                            <div class="config-field">
                                <label for="acMemCrit" data-i18n="config.memory_critical">メモリ危険閾値 (%)</label>
                                <input type="number" id="acMemCrit" min="0" max="100" step="1">
                            </div>
                            <div class="config-field">
                                <label for="acDiskWarn" data-i18n="config.disk_warn">ディスク空き警告閾値 (%)</label>
                                <input type="number" id="acDiskWarn" min="0" max="100" step="1">
                            </div>
                            <div class="config-field">
                                <label for="acDiskCrit" data-i18n="config.disk_critical">ディスク空き危険閾値 (%)</label>
                                <input type="number" id="acDiskCrit" min="0" max="100" step="1">
                            </div>
                            <div class="config-field">
                                <label for="acTempWarn" data-i18n="config.cpu_temp_warn">CPU温度警告閾値 (℃)</label>
                                <input type="number" id="acTempWarn" min="0" max="150" step="1">
                            </div>
                            <div class="config-field">
                                <label for="acTempCrit" data-i18n="config.cpu_temp_critical">CPU温度危険閾値 (℃)</label>
                                <input type="number" id="acTempCrit" min="0" max="150" step="1">
                            </div>
                            <div class="config-field">
                                <label class="checkbox-wrap">
                                    <input type="checkbox" id="acNotifyRecovery">
                                    <span data-i18n="config.notify_recovery">復旧通知を送信する</span>
                                </label>
                            </div>
                        </div>
                        <!-- アラートは GUI/JSON 切替が無くヘッダーの操作群を
                             隠すため、専用の保存ボタンをここに置く。 -->
                        <div class="alert-config-footer">
                            <button class="btn-primary" id="alertConfigSaveBtn" data-i18n="config.save">保存</button>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <!-- 設定スナップショット（タイムトラベル）モーダル -->
        <div class="modal-overlay" id="historyModal" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h3 data-i18n="config.history_title">設定の履歴</h3>
                    <button class="modal-close" id="historyCloseBtn" aria-label="close">×</button>
                </div>
                <div class="modal-body">
                    <p class="gui-help" data-i18n="config.history_help">保存のたびに直前の内容が退避されます。任意の時点に復元できます。</p>
                    <div id="historyList" class="history-list"></div>
                </div>
            </div>
        </div>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="/lang.js"></script>
    <script src="i18n.js?v=6c008cb0"></script>
    <script src="auth-guard.js?v=ecf68d5c"></script>
    <script src="connection.js?v=42bc9643"></script>
    <script src="config-editor.js?v=32ed83cc"></script>
</body>
</html>
